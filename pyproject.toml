[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chlorine"
version = "0.5.0"
description = "Chlorine filesystem intelligence with a tiny Transformer L+ model and web search"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
chlorine = "chlorine.cli:main"
